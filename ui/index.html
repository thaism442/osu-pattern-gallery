<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu! Pattern Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1a22; --bar:#15131a; --card:#28252f; --card2:#2f2b37; --input:#201e27; --line:#35313d;
  --text:#f1eef6; --muted:#8c8597; --accent:#ff66aa; --accent2:#ff8cc0; --glow:rgba(255,102,170,.45);
  --pf:#18161d; --ok:#7cfc9a; --err:#ff6b7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Exo 2','Segoe UI',sans-serif;background:var(--bg);color:var(--text);user-select:none;overflow:hidden}
button,input{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}

/* header */
.top{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar)}
.logo{width:26px;height:26px;background:url(icon.png) center/contain no-repeat;filter:drop-shadow(0 0 6px rgba(255,102,170,.6))}
.brand{font-weight:800;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.iconbtn span{white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:12px;margin-left:8px}
@media (max-width:600px){.brand small{display:none}}
.sp{flex:1}
.iconbtn{height:30px;min-width:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.iconbtn:hover{color:var(--text);border-color:var(--muted)}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 12px var(--glow)}
.iconbtn svg{width:14px;height:14px}

.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px 14px 0}

/* map card */
.map{border-radius:12px;padding:12px 14px;background:var(--card);display:flex;align-items:center;gap:12px;
  background-image:radial-gradient(circle at 100% 0,rgba(255,102,170,.16),transparent 55%)}
.live{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none}
.live.off{background:#5a5563;box-shadow:none}
.map .t1{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.map .t2{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map .txt{min-width:0;flex:1}
.diff{padding:4px 11px;border-radius:20px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:20px;background:var(--card);font-size:13px;font-weight:700;border:1px solid transparent;cursor:pointer;transition:.15s}
.chip:hover{background:var(--card2)}
.chip.on{background:var(--accent);color:#fff;box-shadow:0 0 14px var(--glow)}
.chip .n{opacity:.6;margin-left:5px;font-weight:500}
.chip.add{border:1px dashed var(--muted);background:transparent;color:var(--muted)}
.chip.add:hover{color:var(--text);border-color:var(--text)}
.chip input{background:transparent;border:none;outline:none;width:110px;font-weight:700}

/* inputs */
.row{display:flex;gap:8px}
.input{flex:1;height:40px;border-radius:10px;background:var(--input);border:1px solid var(--line);padding:0 12px;font-size:13px;outline:none;transition:.15s;min-width:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,102,170,.15)}
.input::placeholder{color:var(--muted)}
.search{position:relative;flex:1;display:flex}
.search svg{position:absolute;left:12px;top:12px;width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:36px}
.btn{height:40px;border-radius:10px;padding:0 16px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;
  background:var(--card);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px var(--glow)}
.btn.pri:hover{background:var(--accent2)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}

/* gallery */
.gallery{flex:1;min-height:0;overflow-y:auto;padding:2px 4px 14px 2px;margin-right:-6px}
.gallery::-webkit-scrollbar{width:8px}
.gallery::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.gallery::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.ghead{font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--muted);margin:10px 2px 8px;display:flex;align-items:center;gap:8px}
.ghead:first-child{margin-top:0}
.ghead:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border-radius:12px;background:var(--card);overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--line)}
.card.sel{border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
.card svg.pv{display:block;width:100%;height:auto;background:var(--pf)}
.card .nm{padding:7px 10px 1px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{padding:0 10px 8px;font-size:11px;color:var(--muted)}
.card .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:none;
  color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;line-height:1}
.card:hover .del{display:flex}
.card .del:hover{background:var(--err)}
.empty{margin:30px auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;max-width:320px}
.empty b{color:var(--text)}

/* bottom bar */
.bottom{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:8px 14px 10px;background:var(--bar)}
.toggles{flex:1 1 100%;display:flex;gap:14px;flex-wrap:wrap}
.status{font-size:12px;flex:1 1 100%;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.ok{color:var(--ok)} .status.err{color:var(--err);white-space:normal}
/* edit button + dialog */
.card .edit{position:absolute;top:6px;right:36px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:none;
  color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;line-height:1}
.card:hover .edit{display:flex}
.card .edit:hover{background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(10,9,13,.7);display:none;align-items:center;justify-content:center;z-index:40}
.modal.on{display:flex}
.dlg{width:min(360px,90vw);background:var(--bg);border:2px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dlg .input{flex:none}
.dlg h3{color:var(--accent);font-size:16px;margin-bottom:4px}
.dlg label{font-size:12px;color:var(--muted);margin-top:4px}
.dlg select{height:40px;border-radius:10px;background:var(--input);border:1px solid var(--line);padding:0 10px;font:inherit;color:var(--text);outline:none}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
/* replace toggle */
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 4px}
.toggle .sw{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;transition:.15s;flex:none}
.toggle .sw:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{color:var(--text)}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw:after{left:15px}
/* drop overlay */
.drop{position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:16px;background:rgba(22,20,27,.98);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:50;pointer-events:none;text-align:center;padding:20px}
.drop.on{display:flex}
.drop .big{font-size:20px;font-weight:800;color:var(--accent)}
.drop .small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"></div>
    <div class="brand">Pattern Gallery<small>osu! pattern tool</small></div>
    <div class="sp"></div>
    <button class="iconbtn" id="hkBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h0M7 14h10"/></svg>
      <span id="hkTxt">F11</span>
    </button>
    <button class="iconbtn" id="langBtn" title="Language / Dil">TR</button>
    <button class="iconbtn" id="pinBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3l5 5-3 1-3 3 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 3-3z"/></svg>
      <span id="pinTxt"></span>
    </button>
  </div>

  <div class="content">
    <div class="map">
      <div class="live off" id="live"></div>
      <div class="txt"><div class="t1" id="mapT1"></div><div class="t2" id="mapT2"></div></div>
      <div class="diff" id="diff" style="display:none"></div>
    </div>

    <div class="chips" id="chips"></div>

    <div class="row">
      <input class="input" id="nameIn" maxlength="60">
      <button class="btn pri" id="saveBtn"></button>
    </div>

    <div class="row">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input class="input" id="searchIn">
      </div>
    </div>

    <div class="gallery" id="gallery"></div>
  </div>

  <div class="bottom">
    <div class="status" id="status"></div>
    <div class="toggles">
      <div class="toggle" id="adaptTgl"><div class="sw"></div><span id="adaptTxt"></span></div>
      <div class="toggle" id="replaceTgl"><div class="sw"></div><span id="replaceTxt"></span></div>
    </div>
    <button class="btn" id="exportBtn"></button>
    <button class="btn" id="undoBtn"></button>
    <button class="btn pri" id="insertBtn"></button>
  </div>
</div>

<div class="modal" id="modal"><div class="dlg">
  <h3 id="edTitle"></h3>
  <label id="edNameLbl"></label><input class="input" id="edName" maxlength="60">
  <label id="edCatLbl"></label><select id="edCat"></select>
  <div class="btns"><button class="btn" id="edCancel"></button><button class="btn pri" id="edOk"></button></div>
</div></div>
<div class="drop" id="drop"><div class="big" id="dropBig"></div><div class="small" id="dropSmall"></div></div>
<script>
const TXT = {
  tr: {
    pin: "Hep üstte", adapt: "Ritme uyarla", adaptTip: "Açıkken pattern, haritanın BPM'ine ve slider hızına göre uyarlanır: 1/4 stream 1/4 kalır, 1/2 slider 1/2 uzunluğunda kalır.", exp: "⤓ Dışa aktar", expN: "⤓ Dışa aktar ({0})", expTip: "Seçili pattern(ler)i .osu dosyası olarak kaydeder (5 pattern = 5 dosya). Birden fazla seçmek için Ctrl'ye basılı tutup tıkla (Ctrl+A: hepsi).", selN: "{0} pattern seçili. Dışa aktarmak için ⤓ butonuna bas.", replace: "Çakışanları sil", replaceTip: "Açıkken, pattern'in kapladığı aralıktaki eski notalar silinir ve yerine pattern gelir.", edit: "Düzenle", edTitle: "Pattern'i düzenle", edName: "İsim", edCat: "Kategori", edOk: "Kaydet", edCancel: "İptal", dropBig: "Bırak, kütüphaneye eklensin", dropTo: "→ {0} kategorisine", dropAll: "Kategorisiz olarak eklenecek (önce bir kategori seçebilirsin)", dropHint: ".osu dosyaları, pattern paketleri (.zip) ya da klasörler", hkTip: "Kısayol tuşu (editördeyken): notalar seçiliyse kaydetme penceresi, seçili değilse pattern arayıp ekleme penceresi açılır. Değiştirmek için tıkla.", hkPress: "Bir tuşa bas...", hkHelp: "Yeni kısayol tuşuna bas (Ctrl/Alt/Shift ile birlikte de olur). Vazgeçmek için Esc.", mapOpen: "Editörde açık", mapNone: "osu! editörü açık değil", mapNoneSub: "Haritanı osu! editöründe aç",
    all: "Tümü", newCat: "+ Yeni", newCatPh: "kategori adı", noCat: "Kategorisiz",
    namePh: "Seçili notalara bir isim ver...", namePhCat: "Seçili notalara isim ver → {0}",
    save: "+ Seçileni kaydet", search: "Ara (isim ya da kategori)...",
    undo: "↶ Geri al", insert: "Ekle", ready: "Hazır. Pattern'e çift tıkla, editördeki zamana eklensin.",
    notes: "nota", del: "Sil", working: "Çalışıyor...",
    empty: "Henüz pattern yok.<br><b>Editörde notaları seç</b>, yukarıya bir isim yaz ve <b>Seçileni kaydet</b>'e bas.",
    emptySearch: "Aramana uyan pattern yok.", pickFirst: "Önce bir pattern seç."
  },
  en: {
    pin: "Always on top", adapt: "Adapt rhythm", adaptTip: "When on, the pattern is fitted to the beatmap's BPM and slider velocity: a 1/4 stream stays 1/4, a 1/2 slider stays 1/2 long.", exp: "⤓ Export", expN: "⤓ Export ({0})", expTip: "Saves the selected pattern(s) as .osu files (5 patterns = 5 files). Hold Ctrl and click to select several (Ctrl+A: all).", selN: "{0} patterns selected. Press ⤓ to export them.", replace: "Replace overlapping", replaceTip: "When on, old objects in the pattern's time range are removed and replaced by the pattern.", edit: "Edit", edTitle: "Edit pattern", edName: "Name", edCat: "Category", edOk: "Save", edCancel: "Cancel", dropBig: "Drop to add to your library", dropTo: "→ into \"{0}\"", dropAll: "Will be added without a category (you can pick one first)", dropHint: ".osu files, pattern packs (.zip) or folders", hkTip: "Hotkey (in the editor): with objects selected it opens saving, otherwise searching and inserting a pattern. Click to change it.", hkPress: "Press a key...", hkHelp: "Press the new hotkey (can be combined with Ctrl/Alt/Shift). Esc to cancel.", mapOpen: "Open in editor", mapNone: "osu! editor is not open", mapNoneSub: "Open your beatmap in the osu! editor",
    all: "All", newCat: "+ New", newCatPh: "category name", noCat: "No category",
    namePh: "Name the selected objects...", namePhCat: "Name the selected objects → {0}",
    save: "+ Save selected", search: "Search (name or category)...",
    undo: "↶ Undo", insert: "Insert", ready: "Ready. Double-click a pattern to insert it at the editor time.",
    notes: "objects", del: "Delete", working: "Working...",
    empty: "No patterns yet.<br><b>Select objects in the editor</b>, type a name above and click <b>Save selected</b>.",
    emptySearch: "No pattern matches your search.", pickFirst: "Select a pattern first."
  }
};
const COMBO = ["#ff66aa", "#66ccff", "#ffcc55", "#88ee88"];

let S = { adapt: true, multi: new Set(), lang: "tr", topmost: true, replace: true, editing: null, hotkey: "F11", capturing: false, categories: [], patterns: [], cat: "", search: "", sel: null, map: null, addingCat: false, pendingSave: false };
const $ = id => document.getElementById(id);
const t = (k, ...a) => (TXT[S.lang][k] || k).replace(/\{(\d)\}/g, (_, i) => a[i]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const send = msg => { if (window.chrome && chrome.webview) chrome.webview.postMessage(msg); };

// ------------------------------------------------------------ preview picture
function preview(p) {
  const r = 32;
  let svg = `<svg class="pv" viewBox="0 0 512 384"><rect x="2" y="2" width="508" height="380" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>`;
  const objs = (p.objs || []).map(o => ({ ...o }));
  let combo = -1, num = 0;
  objs.forEach((o, i) => { if (i === 0 || o.nc || o.sp) { combo++; num = 0; } o.num = ++num; o.col = COMBO[combo % COMBO.length]; });

  // dashed lines show the order (flow)
  for (let i = 1; i < objs.length; i++) {
    const a = objs[i - 1], b = objs[i];
    if (a.sp || b.sp) continue;
    const e = a.path && a.path.length ? a.path[a.path.length - 1] : [a.x, a.y];
    svg += `<line x1="${e[0]}" y1="${e[1]}" x2="${b.x}" y2="${b.y}" stroke="#fff" stroke-opacity=".2" stroke-width="3" stroke-dasharray="8 8"/>`;
  }
  // back to front so the first object is on top
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (o.sp) {
      svg += `<circle cx="256" cy="192" r="150" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6"/><circle cx="256" cy="192" r="10" fill="#fff"/>`;
      continue;
    }
    if (o.path && o.path.length > 1) {
      const pts = o.path.map(q => q[0] + "," + q[1]).join(" ");
      svg += `<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="${r * 2}" stroke-linecap="round" stroke-linejoin="round"/>`;
      svg += `<polyline points="${pts}" fill="none" stroke="${o.col}" stroke-opacity=".38" stroke-width="${r * 2 - 9}" stroke-linecap="round" stroke-linejoin="round"/>`;
      const e = o.path[o.path.length - 1];
      svg += `<circle cx="${e[0]}" cy="${e[1]}" r="${r - 5}" fill="none" stroke="#fff" stroke-width="4"/>`;
    }
    svg += `<circle cx="${o.x}" cy="${o.y}" r="${r}" fill="${o.col}" stroke="#fff" stroke-width="5"/>`;
    svg += `<text x="${o.x}" y="${o.y + 12}" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" font-family="Exo 2,Segoe UI">${o.num}</text>`;
  }
  return svg + "</svg>";
}

// ------------------------------------------------------------ drawing the page
function visiblePatterns() {
  const q = S.search.trim().toLowerCase();
  return S.patterns
    .filter(p => q || S.cat === "" || p.cat.toLowerCase() === S.cat.toLowerCase())   // searching looks in every category
    .filter(p => !q || p.name.toLowerCase().includes(q) || (p.cat && p.cat.toLowerCase().startsWith(q)))
    .sort((a, b) => (!a.cat - !b.cat) || a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));   // "no category" last
}

function renderTexts() {
  document.documentElement.lang = S.lang;
  $("langBtn").textContent = S.lang.toUpperCase();
  $("pinTxt").textContent = t("pin");
  $("hkTxt").textContent = S.capturing ? t("hkPress") : S.hotkey;
  $("hkBtn").title = t("hkTip");
  $("hkBtn").classList.toggle("on", S.capturing);
  $("pinBtn").classList.toggle("on", S.topmost);
  $("saveBtn").textContent = t("save");
  $("nameIn").placeholder = S.cat ? t("namePhCat", S.cat) : t("namePh");
  $("searchIn").placeholder = t("search");
  $("undoBtn").textContent = t("undo");
  $("exportBtn").textContent = S.multi.size > 1 ? t("expN", S.multi.size) : t("exp");
  $("exportBtn").title = t("expTip");
  $("adaptTxt").textContent = t("adapt");
  $("adaptTgl").title = t("adaptTip");
  $("adaptTgl").classList.toggle("on", S.adapt);
  $("replaceTxt").textContent = t("replace");
  $("replaceTgl").title = t("replaceTip");
  $("replaceTgl").classList.toggle("on", S.replace);
  $("insertBtn").textContent = t("insert");
  if (!$("status").dataset.set) $("status").textContent = t("ready");
  renderMap();
}

function renderMap() {
  const m = S.map;
  const open = m && m.open;
  $("live").classList.toggle("off", !open);
  $("mapT1").textContent = open ? t("mapOpen") : t("mapNone");
  $("mapT2").textContent = open ? m.title : t("mapNoneSub");
  $("mapT2").style.color = open ? "" : "var(--muted)";
  $("diff").style.display = open && m.diff ? "" : "none";
  $("diff").textContent = open ? m.diff : "";
}

function renderChips() {
  const q = S.search.trim().toLowerCase();
  const count = c => S.patterns.filter(p => p.cat === c).length;
  let h = `<div class="chip ${S.cat === "" ? "on" : ""}" data-cat="">${esc(t("all"))}<span class="n">${S.patterns.length}</span></div>`;
  for (const c of S.categories) {
    // while searching, only show categories that start with the text (or contain matching patterns)
    if (q && !c.toLowerCase().startsWith(q) && !S.patterns.some(p => p.cat === c && p.name.toLowerCase().includes(q)) && c !== S.cat) continue;
    h += `<div class="chip ${S.cat.toLowerCase() === c.toLowerCase() ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}<span class="n">${count(c)}</span></div>`;
  }
  h += S.addingCat
    ? `<div class="chip add"><input id="catIn" placeholder="${esc(t("newCatPh"))}" maxlength="30"></div>`
    : `<div class="chip add" id="addCat">${esc(t("newCat"))}</div>`;
  $("chips").innerHTML = h;
  if (S.addingCat) {
    const inp = $("catIn");
    inp.focus();
    // the category is created on Enter or as soon as you click somewhere else
    const commit = () => {
      if (!S.addingCat) return;
      S.addingCat = false;
      const name = inp.value.trim();
      if (name) { S.cat = name; send({ cmd: "newCategory", name }); }
      renderAll();
    };
    inp.onkeydown = e => {
      if (e.key === "Enter") commit();
      else if (e.key === "Escape") { S.addingCat = false; renderChips(); }
    };
    inp.onblur = commit;
  }
}

function renderGallery() {
  const list = visiblePatterns();
  if (!list.length) {
    $("gallery").innerHTML = `<div class="empty">${S.patterns.length ? t("emptySearch") : t("empty")}</div>`;
    return;
  }
  const groups = [];
  for (const p of list) {
    let g = groups.find(x => x.cat === p.cat);
    if (!g) groups.push(g = { cat: p.cat, items: [] });
    g.items.push(p);
  }
  const showHeads = (S.cat === "" || S.search.trim()) && groups.length > 1;
  let h = "";
  for (const g of groups) {
    if (showHeads) h += `<div class="ghead">${esc(g.cat || t("noCat"))}</div>`;
    h += `<div class="grid">`;
    for (const p of g.items) {
      const meta = `${p.count} ${t("notes")}` + (p.bpm ? ` · ${p.bpm} BPM` : "");
      h += `<div class="card ${S.multi.has(p.path) ? "sel" : ""}" data-path="${esc(p.path)}" title="${esc(p.name)}">
              ${preview(p)}
              <button class="edit" data-edit="${esc(p.path)}" title="${esc(t("edit"))}">✎</button>
              <button class="del" data-del="${esc(p.path)}" title="${esc(t("del"))}">✕</button>
              <div class="nm">${esc(p.name)}</div><div class="meta">${meta}</div>
            </div>`;
    }
    h += `</div>`;
  }
  $("gallery").innerHTML = h;
}

function renderAll() { renderTexts(); renderChips(); renderGallery(); }

function setStatus(text, cls) {
  const s = $("status");
  s.textContent = text;
  s.className = "status " + (cls || "");
  s.dataset.set = "1";
  s.title = text;
}

// ------------------------------------------------------------ events
$("chips").addEventListener("click", e => {
  if (e.target.closest("#addCat")) { S.addingCat = true; renderChips(); return; }
  const chip = e.target.closest(".chip[data-cat]");
  if (chip) { S.cat = chip.dataset.cat; renderAll(); }
});

$("gallery").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); send({ cmd: "delete", path: del.dataset.del }); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { e.stopPropagation(); openEdit(ed.dataset.edit); return; }
  const card = e.target.closest(".card");
  if (card) {
    const path = card.dataset.path;
    if (e.ctrlKey) {                       // Ctrl+click: add / remove from the selection
      if (S.multi.has(path)) S.multi.delete(path); else S.multi.add(path);
      S.sel = S.multi.has(path) ? path : [...S.multi].pop() || null;
    } else {
      S.multi = new Set([path]); S.sel = path;
    }
    document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", S.multi.has(c.dataset.path)));
    if (S.multi.size > 1) setStatus(t("selN", S.multi.size));
    renderTexts();
  }
});
$("gallery").addEventListener("dblclick", e => {
  const card = e.target.closest(".card");
  if (card && !e.target.closest("[data-del]") && !e.target.closest("[data-edit]")) insert(card.dataset.path);
});

function insert(path) {
  if (!path) { setStatus(t("pickFirst"), "err"); return; }
  setStatus(t("working"));
  send({ cmd: "insert", path, replace: S.replace, adapt: S.adapt });
}
function save() {
  S.pendingSave = true;
  setStatus(t("working"));
  send({ cmd: "save", category: S.cat, name: $("nameIn").value });
}

$("insertBtn").onclick = () => insert(S.sel);
$("exportBtn").onclick = () => {
  const paths = S.multi.size ? [...S.multi] : (S.sel ? [S.sel] : []);
  if (!paths.length) { setStatus(t("pickFirst"), "err"); return; }
  send({ cmd: "export", paths });
};
document.addEventListener("keydown", e => {   // Ctrl+A selects every visible pattern
  if (e.ctrlKey && e.key.toLowerCase() === "a" && !["INPUT", "SELECT"].includes(e.target.tagName) && !S.capturing) {
    e.preventDefault();
    S.multi = new Set(visiblePatterns().map(p => p.path));
    S.sel = [...S.multi][0] || null;
    renderGallery(); renderTexts();
    if (S.multi.size) setStatus(t("selN", S.multi.size));
  }
});
$("undoBtn").onclick = () => { setStatus(t("working")); send({ cmd: "undo" }); };
$("saveBtn").onclick = save;
$("nameIn").onkeydown = e => { if (e.key === "Enter") save(); };
$("searchIn").oninput = e => { S.search = e.target.value; renderChips(); renderGallery(); };
$("hkBtn").onclick = () => {
  S.capturing = !S.capturing;
  send({ cmd: "hotkeyCapture", on: S.capturing });
  if (S.capturing) setStatus(t("hkHelp")); else delete $("status").dataset.set;
  renderTexts();
};
// picking a new hotkey
document.addEventListener("keydown", e => {
  if (!S.capturing) return;
  e.preventDefault(); e.stopPropagation();
  if (e.key === "Escape") { S.capturing = false; send({ cmd: "hotkeyCapture", on: false }); setStatus(t("ready")); renderTexts(); return; }
  if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;   // wait for the real key
  let key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (e.code.startsWith("Numpad")) key = "Num" + e.code.slice(6);
  const label = (e.ctrlKey ? "Ctrl+" : "") + (e.altKey ? "Alt+" : "") + (e.shiftKey ? "Shift+" : "") + key;
  S.capturing = false; S.hotkey = label;
  send({ cmd: "hotkey", vk: e.keyCode, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, label });
  renderTexts();
}, true);
$("pinBtn").onclick = () => { S.topmost = !S.topmost; renderTexts(); send({ cmd: "topmost", value: S.topmost }); };
$("langBtn").onclick = () => { S.lang = S.lang === "tr" ? "en" : "tr"; delete $("status").dataset.set; renderAll(); send({ cmd: "lang", value: S.lang }); };
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target === document.body && S.sel) insert(S.sel);
});

// ------------------------------------------------------------ replace toggle + edit dialog
$("adaptTgl").onclick = () => { S.adapt = !S.adapt; renderTexts(); send({ cmd: "adapt", value: S.adapt }); };
$("replaceTgl").onclick = () => { S.replace = !S.replace; renderTexts(); send({ cmd: "replace", value: S.replace }); };

function openEdit(path) {
  const p = S.patterns.find(x => x.path === path);
  if (!p) return;
  S.editing = p;
  $("edTitle").textContent = t("edTitle");
  $("edNameLbl").textContent = t("edName");
  $("edCatLbl").textContent = t("edCat");
  $("edOk").textContent = t("edOk");
  $("edCancel").textContent = t("edCancel");
  $("edName").value = p.name;
  $("edCat").innerHTML = `<option value="">${esc(t("noCat"))}</option>` +
    S.categories.map(c => `<option value="${esc(c)}"${c === p.cat ? " selected" : ""}>${esc(c)}</option>`).join("");
  $("modal").classList.add("on");
  $("edName").focus(); $("edName").select();
}
function closeEdit() { S.editing = null; $("modal").classList.remove("on"); }
function saveEdit() {
  if (!S.editing) return;
  send({ cmd: "rename", path: S.editing.path, name: $("edName").value, category: $("edCat").value });
  closeEdit();
}
$("edOk").onclick = saveEdit;
$("edCancel").onclick = closeEdit;
$("modal").addEventListener("mousedown", e => { if (e.target.id === "modal") closeEdit(); });
$("modal").addEventListener("keydown", e => { if (e.key === "Enter") saveEdit(); else if (e.key === "Escape") closeEdit(); });

// ------------------------------------------------------------ drag & drop .osu files / folders
let dragDepth = 0;
const isFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
window.addEventListener("dragenter", e => {
  if (!isFiles(e)) return;
  e.preventDefault(); dragDepth++;
  $("dropBig").textContent = t("dropBig");
  $("dropSmall").innerHTML = esc(S.cat ? t("dropTo", S.cat) : t("dropAll")) + "<br>" + esc(t("dropHint"));
  $("drop").classList.add("on");
});
window.addEventListener("dragover", e => { if (isFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
window.addEventListener("dragleave", e => { if (isFiles(e) && --dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("on"); } });
window.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0; $("drop").classList.remove("on");
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length || !(window.chrome && chrome.webview)) return;
  setStatus(t("working"));
  chrome.webview.postMessageWithAdditionalObjects({ cmd: "import", category: S.cat }, files);
});

// ------------------------------------------------------------ messages from the program
function onMessage(m) {
  if (m.type === "state") {
    S.lang = m.lang; S.topmost = m.topmost; S.replace = m.replace !== false; S.adapt = m.adapt !== false; S.hotkey = m.hotkey || "F11"; S.categories = m.categories || []; S.patterns = m.patterns || [];
    if (S.cat && !S.categories.some(c => c.toLowerCase() === S.cat.toLowerCase())) S.cat = "";
    if (S.sel && !S.patterns.some(p => p.path === S.sel)) S.sel = null;
    S.multi = new Set([...S.multi].filter(x => S.patterns.some(p => p.path === x)));
    renderAll();
  } else if (m.type === "map") {
    S.map = m; renderMap();
  } else if (m.type === "status") {
    setStatus(m.text, m.ok ? "ok" : "err");
    if (m.action === "save" && m.ok && S.pendingSave) $("nameIn").value = "";
    if (m.action === "save") S.pendingSave = false;
  }
}
if (window.chrome && chrome.webview) chrome.webview.addEventListener("message", e => onMessage(e.data));

renderAll();
send({ cmd: "ready" });
</script>
</body>
</html>
